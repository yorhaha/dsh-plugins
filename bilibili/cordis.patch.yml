# dsh-bilibili bundle patch: mounts the account-data plugin.
#
# The row id and package name must stay unique in the Loader graph. The row
# states no config: every option defaults in `index.js` (DEFAULT_CONFIG), which
# is the one place a default lives. A deployment that wants another account
# slot, capture time, or login window adds that key under this row — here or in
# its own patch layer — and only the keys it names change.
#
# The plugin declares no schema library, so it validates the row itself at load:
# an unknown key, a malformed cron expression, or a bad account slot fails the
# load rather than silently falling back to a default.
- insert:
    - id: bilibili
      name: 'dsh-bilibili'
