# dsh-notify bundle patch: mounts the PushPlus notification plugin.
#
# The row id and package name must stay unique in the Loader graph. The row
# states no config: every option defaults in `src/config.js` (DEFAULT_CONFIG),
# which is the one place a default lives. A deployment that wants another
# endpoint, template, or size bound adds that key under this row — here or in
# its own patch layer — and only the keys it names change.
#
# The plugin declares no schema library, so it validates the row itself at load:
# a relative endpoint, an unknown template, or a request timeout larger than the
# tool timeout fails the load rather than silently falling back.
#
# PushPlus tokens are NOT here. They are secrets, so they live in the credential
# store (`~/.dsh/.credentials.yaml`, records under the `notify` scope) and are
# managed from the Plugins page, on the Notifications row.
- insert:
    - id: notify
      name: 'dsh-notify'
